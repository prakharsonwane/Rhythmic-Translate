<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rhythmic Translate</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(135deg,#020617,#0f172a,#111827);
      color:white;
      min-height:100vh;
      display:flex;
      overflow:hidden;
    }

    /* SIDEBAR */

    .sidebar{
      width:270px;
      background:rgba(15,23,42,0.95);
      border-right:1px solid rgba(255,255,255,0.08);
      padding:20px;
      overflow-y:auto;
    }

    .sidebar h2{
      font-size:24px;
      margin-bottom:20px;
      color:#c4b5fd;
    }

    .saved-item{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      padding:14px;
      border-radius:16px;
      margin-bottom:12px;
      transition:0.3s;
      word-break:break-word;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .saved-item:hover{
      background:rgba(139,92,246,0.15);
      border-color:#8b5cf6;
    }

    .saved-text{
      flex:1;
      cursor:pointer;
    }

    .delete-btn{
      background:transparent;
      border:none;
      color:#f87171;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .delete-btn:hover{
      transform:scale(1.2);
      color:#ef4444;
    }

    /* MAIN */

    .container{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
      overflow:auto;
    }

    .card{
      width:100%;
      max-width:950px;
      background:rgba(15,23,42,0.78);
      border:1px solid rgba(255,255,255,0.08);
      padding:35px;
      border-radius:30px;
      box-shadow:0 0 45px rgba(139,92,246,0.22);
    }

    h1{
      text-align:center;
      font-size:48px;
      margin-bottom:10px;
      color:#c4b5fd;
    }

    .subtitle{
      text-align:center;
      color:#94a3b8;
      margin-bottom:30px;
      font-size:18px;
    }

    label{
      display:block;
      margin-top:20px;
      margin-bottom:12px;
      font-size:16px;
      color:#cbd5e1;
      font-weight:bold;
    }

    /* TEXTAREA */

    textarea{
      width:100%;
      height:140px;
      border:none;
      outline:none;
      resize:none;
      border-radius:22px;
      padding:20px;
      font-size:18px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      color:white;
      overflow:auto;
    }

    textarea::placeholder{
      color:#64748b;
    }

    textarea:focus{
      border-color:#8b5cf6;
    }

    /* BUTTONS */

    .buttons{
      display:flex;
      gap:10px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    button{
      flex:1;
      min-width:120px;
      padding:13px 10px;
      border:none;
      border-radius:16px;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      color:white;
    }

    button:hover{
      transform:translateY(-2px);
    }

    #copyBtn{
      background:#22c55e;
    }

    #saveBtn{
      background:#3b82f6;
    }

    #undoBtn{
      background:#f59e0b;
      max-width:60px;
    }

    #redoBtn{
      background:#8b5cf6;
      max-width:60px;
    }

    #clearBtn{
      background:#ef4444;
    }

    /* MOBILE */

    @media(max-width:900px){

      body{
        flex-direction:column;
        overflow:auto;
      }

      .sidebar{
        width:100%;
      }

      .container{
        padding:18px;
      }

      h1{
        font-size:34px;
      }

      textarea{
        font-size:16px;
      }

    }

  </style>
</head>
<body>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <h2>💾 Saved Notes</h2>

    <div id="savedList"></div>

  </div>

  <!-- MAIN -->

  <div class="container">

    <div class="card">

      <h1>Rhythmic Translate</h1>

      <p class="subtitle">
        English → Hindi Translator
      </p>

      <label>English Text</label>

      <textarea
        id="englishInput"
        placeholder="Type English here..."
      ></textarea>

      <label>Hindi Translation</label>

      <textarea
        id="hindiOutput"
        readonly
        placeholder="Hindi translation will appear here..."
      ></textarea>

      <!-- BUTTONS -->

      <div class="buttons">

        <button id="copyBtn">📋 Copy</button>

        <button id="saveBtn">💾 Save</button>

        <button id="undoBtn">↩</button>

        <button id="redoBtn">↪</button>

        <button id="clearBtn">🗑 Clear</button>

      </div>

    </div>

  </div>

  <script>

    const englishInput =
      document.getElementById("englishInput");

    const hindiOutput =
      document.getElementById("hindiOutput");

    const copyBtn =
      document.getElementById("copyBtn");

    const saveBtn =
      document.getElementById("saveBtn");

    const undoBtn =
      document.getElementById("undoBtn");

    const redoBtn =
      document.getElementById("redoBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const savedList =
      document.getElementById("savedList");

    let redoStack = [];

    // TRANSLATE

    async function translateToHindi(text){

      try{

        const response = await fetch(
          "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=" +
          encodeURIComponent(text)
        );

        const data = await response.json();

        return data[0]
          .map(item => item[0])
          .join("");

      }catch(error){

        console.error(error);

        return "Translation failed";

      }

    }

    // LIVE TRANSLATION

    let timeout;

    englishInput.addEventListener("input", () => {

      clearTimeout(timeout);

      timeout = setTimeout(async () => {

        const text =
          englishInput.value.trim();

        if(!text){

          hindiOutput.value = "";

          return;

        }

        const translated =
          await translateToHindi(text);

        hindiOutput.value = translated;

      },400);

    });

    // COPY

    copyBtn.addEventListener("click", async () => {

      if(!hindiOutput.value) return;

      await navigator.clipboard.writeText(
        hindiOutput.value
      );

      copyBtn.innerText = "✅ Copied";

      setTimeout(() => {

        copyBtn.innerText = "📋 Copy";

      },2000);

    });

    // SAVE

    saveBtn.addEventListener("click", () => {

      const text =
        hindiOutput.value;

      if(!text) return;

      const notes =
        JSON.parse(
          localStorage.getItem("rhythmicNotes")
        ) || [];

      notes.push(text);

      localStorage.setItem(
        "rhythmicNotes",
        JSON.stringify(notes)
      );

      loadSavedNotes();

    });

    // LOAD NOTES

    function loadSavedNotes(){

      const notes =
        JSON.parse(
          localStorage.getItem("rhythmicNotes")
        ) || [];

      savedList.innerHTML = "";

      notes.forEach((note,index) => {

        const div =
          document.createElement("div");

        div.className = "saved-item";

        // NOTE TEXT

        const text =
          document.createElement("span");

        text.className = "saved-text";

        text.innerText =
          note.substring(0,60);

        text.addEventListener("click", () => {

          hindiOutput.value = note;

        });

        // DELETE BUTTON

        const delBtn =
          document.createElement("button");

        delBtn.className = "delete-btn";

        delBtn.innerText = "✖";

        delBtn.addEventListener("click",(e)=>{

          e.stopPropagation();

          notes.splice(index,1);

          localStorage.setItem(
            "rhythmicNotes",
            JSON.stringify(notes)
          );

          loadSavedNotes();

        });

        div.appendChild(text);

        div.appendChild(delBtn);

        savedList.appendChild(div);

      });

    }

    // UNDO

    undoBtn.addEventListener("click", () => {

      const current =
        englishInput.value;

      if(current.length > 0){

        redoStack.push(current);

        englishInput.value =
          current.slice(0,-1);

      }

    });

    // REDO

    redoBtn.addEventListener("click", () => {

      if(redoStack.length > 0){

        englishInput.value =
          redoStack.pop();

      }

    });

    // CLEAR

    clearBtn.addEventListener("click", () => {

      englishInput.value = "";

      hindiOutput.value = "";

    });

    // INITIAL LOAD

    loadSavedNotes();

  </script>

</body>
</html>
